name: Apply simplified public identity

on:
  push:
    branches:
      - chore/simplify-report-branding

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update every HTML page
        run: node scripts/addPrintSupport.mjs
      - name: Commit generated page updates
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No page updates required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git commit -m "Apply Tools and Native Structures identity to every page"
          git push origin HEAD:${GITHUB_REF_NAME}
