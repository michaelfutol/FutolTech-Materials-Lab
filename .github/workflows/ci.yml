name: Engineering checks

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax checks
        run: npm run check
      - name: Comparison PDF gate
        run: node scripts/verifyComparisonPdf.mjs
      - name: Side-by-side comparison Chromium gate
        run: node scripts/verifyComparisonPlaybackUi.mjs
      - name: Deterministic engineering tests
        run: npm test
      - name: C-purlin Chromium gate
        run: node scripts/verifyCPurlinOrientationUi.mjs
      - name: Connection Lab Chromium gate
        run: node scripts/verifyConnectionLabUi.mjs
      - name: Governing-limit Chromium gate
        run: node scripts/verifyGoverningLimitTimelineUi.mjs
      - name: Failure Physics Chromium gate
        run: node scripts/verifyFailurePhysicsUi.mjs
      - name: Specimen Simulation Chromium gate
        run: node scripts/verifySimulationPlaybackUi.mjs
      - name: Print typography Chromium gate
        run: node scripts/verifyPrintTypographyUi.mjs
      - name: Pencil figure Chromium gate
        run: node scripts/verifyFigureStyleUi.mjs
      - name: Assembly Lab Chromium gate
        run: node scripts/verifyAssemblyLabUi.mjs
      - name: Design Explorer Chromium gate
        run: node scripts/verifyDesignExplorerUi.mjs
      - name: Calibration Lab Chromium gate
        run: node scripts/verifyCalibrationLabUi.mjs
      - name: NF-001 rigid Chromium gate
        run: node scripts/verifyFrameAnalyzerUi.mjs rigid
      - name: NF-001 brace Chromium gate
        run: node scripts/verifyFrameAnalyzerUi.mjs brace
      - name: NF-001 semi-rigid Chromium gate
        run: node scripts/verifyFrameAnalyzerUi.mjs spring
      - name: NF-001 P-Delta Chromium gate
        run: node scripts/verifyFrameAnalyzerUi.mjs pdelta
      - name: NF-001 redistribution Chromium gate
        run: node scripts/verifyFrameAnalyzerUi.mjs redistribution
