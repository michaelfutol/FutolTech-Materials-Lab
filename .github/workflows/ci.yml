name: Engineering checks

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repository line count
        run: node scripts/repoLineCount.mjs
      - name: Syntax checks
        run: npm run check
      - name: Comparison PDF gate
        run: node scripts/verifyComparisonPdf.mjs
      - name: Dedicated C-purlin comparison playback Chromium gate
        run: node scripts/verifyComparisonPlaybackUi.mjs
      - name: C-purlin gravity + wind Chromium gate
        timeout-minutes: 3
        run: node scripts/verifyCPurlinGravityWindUi.mjs
      - name: Roof Bay M2 Chromium gate
        timeout-minutes: 3
        run: node scripts/verifyRoofBayUi.mjs
      - name: Roof Bay selectable load-path Chromium gate
        timeout-minutes: 3
        run: node scripts/verifyRoofBayInteractionV2.mjs
      - name: General comparison load-test video Chromium gate
        timeout-minutes: 3
        run: node scripts/verifyGeneralComparisonVideoUi.mjs
      - name: General comparison full-width + 16s recording Chromium gate
        timeout-minutes: 3
        run: node scripts/verifyGeneralComparisonUxV2.mjs
      - name: C-purlin roof-slope Chromium gate
        run: node scripts/verifyCPurlinSlopeUi.mjs
      - name: C-purlin physics-bench Chromium gate
        run: node scripts/verifyCPurlinPhysicsBenchUi.mjs
      - name: C-purlin shared-conditions Chromium gate
        run: node scripts/verifyCPurlinSharedConditionsStable.mjs
      - name: C-purlin polish V3 Chromium gate
        run: node scripts/verifyCPurlinPolishV3Ui.mjs
      - name: C-purlin coordinated V5 Chromium gate
        run: node scripts/verifyCPurlinCoordinationV5Ui.mjs
      - name: C-purlin gradual-deflection Chromium gate
        run: node scripts/verifyCPurlinGradualDeflectionUi.mjs
      - name: C-purlin recorded gradual-deflection Chromium gate
        run: node scripts/verifyCPurlinRecordingGradualUi.mjs
      - name: C-purlin PaperMatte WebM download Chromium gate
        run: node scripts/verifyCPurlinVideoDownloadUi.mjs
      - name: Deterministic engineering tests
        run: npm test
      - name: C-purlin Chromium gate
        run: node scripts/verifyCPurlinOrientationUi.mjs
      - name: Connection Lab Chromium gate
        run: node scripts/verifyConnectionLabUi.mjs
      - name: Governing-limit Chromium gate
        run: node scripts/verifyGoverningLimitTimelineUi.mjs
      - name: Failure Physics Chromium gate
        run: node scripts/verifyFailurePhysicsUi.mjs
      - name: Specimen Simulation Chromium gate
        run: node scripts/verifySimulationPlaybackUi.mjs
      - name: Print typography Chromium gate
        run: node scripts/verifyPrintTypographyUi.mjs
      - name: Pencil figure Chromium gate
        run: node scripts/verifyFigureStyleUi.mjs
      - name: Assembly Lab Chromium gate
        run: node scripts/verifyAssemblyLabUi.mjs
      - name: Design Explorer Chromium gate
        run: node scripts/verifyDesignExplorerUi.mjs
      - name: Calibration Lab Chromium gate
        run: node scripts/verifyCalibrationLabUi.mjs
      - name: Calibration Lab soft-access Chromium gate
        run: node scripts/verifyCalibrationAccessGateUi.mjs
      - name: NF-001 rigid Chromium gate
        run: node scripts/verifyFrameAnalyzerUi.mjs rigid
      - name: NF-001 brace Chromium gate
        run: node scripts/verifyFrameAnalyzerUi.mjs brace
      - name: NF-001 semi-rigid Chromium gate
        run: node scripts/verifyFrameAnalyzerUi.mjs spring
      - name: NF-001 P-Delta Chromium gate
        run: node scripts/verifyFrameAnalyzerUi.mjs pdelta
      - name: NF-001 redistribution Chromium gate
        run: node scripts/verifyFrameAnalyzerUi.mjs redistribution
